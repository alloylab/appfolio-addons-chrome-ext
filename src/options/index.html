<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Appfolio Addons Options</title>
        <style>
            body {
                font-family: sans-serif;
                padding: 20px;
                line-height: 1.6;
                min-width: 260px;
            }
            .option-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                cursor: pointer;
            }
            #status {
                height: 20px;
                color: #2e7d32;
                font-size: 0.9em;
            }
        </style>
    </head>
    <body>
        <div class="option-group">
            <label>
                <input type="checkbox" id="markdown-toggle" data-setting="isMarkdownEnabled" />
                Enable Markdown Notes
            </label>
            <label>
                <input type="checkbox" id="darkmode-toggle" data-setting="isDarkModeEnabled" />
                Enable Dark Mode
            </label>
        </div>

        <div id="status" role="status" aria-live="polite"></div>
        <script src="script.js"></script>
    </body>
</html>
